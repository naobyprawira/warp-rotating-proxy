[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-rotating-proxy"
version = "0.2.1"
description = "Zero-dependency Python 3 HTTP CONNECT and forward proxy backed by Cloudflare WARP MASQUE with IPv6 /64 rotation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
warp-rotating-proxy = "warp_proxy.server:main"

[tool.setuptools.packages.find]
where = ["src"]
